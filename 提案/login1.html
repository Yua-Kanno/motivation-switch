<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivex - Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login1.css">
</head>
<body>

    <main class="main-content">
        <div class="signup-form">
            <h2 class="welcome-text">Welcome to Motivex</h2>
            
            <div class="input-fields">
                <input type="text" id="new-username" placeholder="Username" class="input-box">
                <input type="password" id="new-password" placeholder="Password" class="input-box">
            </div>

            <button id="signup-btn" class="btn-red-signin">SIGN UP</button>
        </div>
    </main>

    <script src="login1.js"></script>
</body>
</html>
