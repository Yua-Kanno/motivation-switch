<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motivex Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Passion+One:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <header class="top-nav">
        <span>Don't have an account?</span>
        <button id="to-signup-btn" class="btn-black">SIGN UP</button>
    </header>

    <main class="main-content">
        <div class="logo-container">
            <img src="ログイン.png" alt="START GAME" class="game-logo">
        </div>

        <div class="login-form">
            <h2 class="welcome-text">Welcome to Motivex</h2>
            
            <div class="input-fields">
                <input type="text" id="login-username" placeholder="Username" class="input-box">
                <input type="password" id="login-password" placeholder="Password" class="input-box">
            </div>

            <button class="btn-red-signin">LOGIN</button>
        </div>
    </main>
    <script src="login.js"></script>

</body>
</html>
