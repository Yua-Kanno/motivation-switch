<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Motivex - Session (IGNITION)</title>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style3.css" />
</head>

<body>

<div class="app">

  <div class="left">

    <div class="header">
      <span class="mode" id="modeLabel">MODE: IGNITION</span>
    </div>

    <div class="chat-box">
      <div class="chat-title">chat</div>
      <div class="chat-content" id="chatContent"></div>
    </div>

    <div class="bottom-area">
      <div class="command-bar">

        <button class="plus-btn">
          <img src="プラスボタン.png" alt="plus">
        </button>

        <input
          type="text"
          id="chatInput"
          class="chat-input"
          placeholder="Mission を入力"
        >

        <button id="sendBtn" class="send-btn">▶</button>

      </div>
    </div>

  </div>

  <div class="right">

    <div class="date-wrap">
      <div class="field">
        <label class="date-label">START:</label>
        <input type="date" value="2026-01-15">
      </div>
      <div class="field">
        <label class="date-label">FINISH:</label>
        <input type="date" value="2026-01-15">
      </div>
    </div>

    <div class="day-status" id="calendarDay">DAY 1 / 1</div>

    <div class="mission-section" id="missionSection">
      <div class="mission-label">MISSION LIST</div>
      <div class="mission-lock-overlay"></div> 
      <div id="missionList" class="mission-list">
        </div>
    </div>

    <div class="progress-section">
      <div class="progress-label">progress</div>
      <div class="progress-bar-wrapper">
        <div class="progress-frame"></div>
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="progress-text" id="progressText">0%</span>
    </div>

    <button class="start-btn">SESSION<br>START</button>

  </div>

</div>

<script src="status.js"></script>
</body>
</html>
